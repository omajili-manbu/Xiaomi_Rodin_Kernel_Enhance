name: release-kernel

# 手动触发：取最近一次成功的 build-kernel 构建产物，发布 release（默认 prerelease）。
# build-kernel 双目标化后（618/66 同名工作流、同 head_branch），按 kernel_target
# 输入甄别目标 run（依 job 步骤名，无标记的历史 run 视为 66）；显式 run_id 时不甄别。
# 正文格式对齐 v1.3（内核版本 / 构建时间 / 构建工具链 / 下载说明 / 变更）：
#   - 内核版本 / 构建时间 / 构建工具链 从 AK3 包内 Image 的 Linux banner 中提取，
#     提取失败时回退到 artifact 名 / 构建记录时间
#   - 每种内核各自的版本 / 构建时间 / 构建工具链；下载说明按实际收集到的资产生成：
#     带 root / 无 root 两种内核 + 标准 / 伪装两种管理器
#   - 变更内容优先用手动输入的 Markdown，留空时按「上一个 tag..本次构建 commit」自动生成
# 产物（assets）：
#   - AnyKernel3_<ver>.zip：带 root 内核可刷包（取 KERNEL_BRANCH 最近一次成功构建）
#   - AnyKernel3_<ver>_noroot.zip：无 root 内核可刷包（取 NOROOT_BRANCH 最近一次成功构建，
#     include_noroot=false 时跳过）
#   - SukiSU_v*_<count>-release[-spoofed].apk：标准 / 伪装管理器（构建 run 缺的变体
#     从锚定 release 现取，锚 tag 与 count 均取自被发布 commit，保证与内核模块配对）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（例如 v1.3）'
        required: true
      title:
        description: '发布标题（留空则用 tag）'
        required: false
        default: ''
      changelog:
        description: '变更内容，Markdown，原样写入正文「变更：」之后（留空则按上个 tag..本次构建 commit 自动生成）'
        required: false
        default: ''
      run_id:
        description: 'build-kernel 运行 ID（留空则取最近一次成功构建，仅对带 root 内核生效）'
        required: false
        default: ''
      kernel_target:
        description: '构建目标甄别：66 = 6.6 KMI（历史默认），618 = 6.18 rebase 树；显式 run_id 时忽略'
        required: false
        default: '66'
      include_noroot:
        description: '是否附带无 root 内核 AK3（取 noroot 分支最近一次成功构建；false 只发带 root 内核）'
        required: false
        default: 'true'
      prerelease:
        description: '是否标记为 prerelease（true / false）'
        required: false
        default: 'true'

permissions:
  contents: write
  actions: read

env:
  KERNEL_BRANCH: bsp-rodin-v-upstream
  NOROOT_BRANCH: bsp-rodin-v-upstream-noroot
  BUILD_WORKFLOW: build-kernel.yml
  SUKISU_REPO: SukiSU-Ultra/SukiSU-Ultra

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve latest successful build runs
        env:
          GH_TOKEN: ${{ github.token }}
          IN_RUN_ID: ${{ inputs.run_id }}
          IN_INCLUDE_NOROOT: ${{ inputs.include_noroot }}
          IN_TARGET: ${{ inputs.kernel_target }}
        run: |
          set -euo pipefail
          RUN_ID="${IN_RUN_ID}"
          if [ -z "$RUN_ID" ]; then
            # 双目标 build-kernel 的 618/66 run 同 head_branch，按 job 步骤名甄别：
            # 带 "(6.6 KMI" 为 66、带 "(618," 为 618；两都不带的历史 run 一律视为
            # 66（双目标化前该工作流只有 6.6 构建）
            run_target() { # $1=run_id -> echo 66/618
              local names
              # 条件步被跳过时也出现在步骤表（conclusion=skipped），只认真跑过的
              names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1/jobs?per_page=1" \
                      --jq '.jobs[0].steps[] | select(.conclusion=="success") | .name' 2>/dev/null || true)
              case "$names" in
                *"6.6 KMI"*) echo 66 ;;
                *"618,"*)    echo 618 ;;
                *)           echo 66 ;;
              esac
            }
            for rid in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${BUILD_WORKFLOW}/runs?branch=${KERNEL_BRANCH}&status=success&per_page=30" \
                           --jq '.workflow_runs[].id'); do
              T=$(run_target "$rid")
              if [ "$T" = "${IN_TARGET}" ]; then RUN_ID="$rid"; break; fi
              echo "skip run $rid (target $T != ${IN_TARGET})"
            done
          fi
          [ -n "$RUN_ID" ] || { echo "::error::no successful ${BUILD_WORKFLOW} run for target ${IN_TARGET} on ${KERNEL_BRANCH}"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '"build run: \(.id) (\(.display_title)) head=\(.head_sha) created=\(.created_at)"'
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')
          CREATED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.created_at')

          # 无 root 内核：取 noroot 分支最近一次成功构建（workflow 文件同名，按 head_branch 过滤）
          NOROOT_RUN_ID=""
          NOROOT_CREATED_AT=""
          if [ "${IN_INCLUDE_NOROOT:-true}" != "false" ]; then
            NOROOT_RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${BUILD_WORKFLOW}/runs?branch=${NOROOT_BRANCH}&status=success&per_page=1" \
                            --jq '.workflow_runs[0].id // empty' || true)
            if [ -z "$NOROOT_RUN_ID" ]; then
              echo "::error::no successful ${BUILD_WORKFLOW} run found on ${NOROOT_BRANCH} - dispatch build-kernel on ${NOROOT_BRANCH} first, or set include_noroot=false to publish the rooted kernel only"
              exit 1
            fi
            NOROOT_CREATED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NOROOT_RUN_ID}" --jq '.created_at')
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NOROOT_RUN_ID}" \
              --jq '"noroot build run: \(.id) (\(.display_title)) head=\(.head_sha) created=\(.created_at)"'
          else
            echo "noroot kernel: skipped (include_noroot=false)"
          fi

          {
            echo "RUN_ID=${RUN_ID}"
            echo "HEAD_SHA=${HEAD_SHA}"
            echo "RUN_CREATED_AT=${CREATED_AT}"
            echo "NOROOT_RUN_ID=${NOROOT_RUN_ID}"
            echo "NOROOT_CREATED_AT=${NOROOT_CREATED_AT}"
          } >> "$GITHUB_ENV"

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          AK3_ID=""; AK3_NAME=""; MGR_ID=""; MGR_NAME=""; SPOOF_ID=""; SPOOF_NAME=""
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            case "$name" in
              *-AnyKernel3)      AK3_ID="$id";   AK3_NAME="$name" ;;
              *-manager-spoofed) SPOOF_ID="$id"; SPOOF_NAME="$name" ;;
              *-manager)         MGR_ID="$id";   MGR_NAME="$name" ;;
            esac
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
                   --jq '.artifacts[] | select(.expired==false) | "\(.id)\t\(.name)"')
          [ -n "$AK3_ID" ] || { echo "::error::AnyKernel3 artifact not found in run ${RUN_ID}"; exit 1; }
          echo "AK3   : ${AK3_NAME} (${AK3_ID})"
          echo "MGR   : ${MGR_NAME:-<none>} (${MGR_ID:-none})"
          echo "SPOOF : ${SPOOF_NAME:-<none>} (${SPOOF_ID:-none})"

          # AK3 artifact 的 zip 本身就是可刷包，直接下载即用
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AK3_ID}/zip" > "$RUNNER_TEMP/dl/ak3.zip"
          unzip -oq "$RUNNER_TEMP/dl/ak3.zip" -d "$RUNNER_TEMP/dl/ak3"
          test -f "$RUNNER_TEMP/dl/ak3/Image" || { echo "::error::Image blob missing in AnyKernel3 artifact"; exit 1; }

          # manager artifact 里是 apk，需要解包取出
          for pair in "${MGR_ID:-}|mgr" "${SPOOF_ID:-}|spoof"; do
            aid="${pair%%|*}"; d="${pair##*|}"
            [ -n "$aid" ] || continue
            mkdir -p "$RUNNER_TEMP/dl/$d"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" > "$RUNNER_TEMP/dl/$d.zip"
            unzip -oq "$RUNNER_TEMP/dl/$d.zip" -d "$RUNNER_TEMP/dl/$d"
          done

          # 管理器兜底：按实际到手的 APK 文件名判定缺哪个变体（旧版 build-kernel 的
          # manager artifact 里装的也是伪装版，artifact 名判断不出内容）。缺的变体从
          # 锚定 release 现取：锚 tag 与 count 均取自被发布 commit（HEAD_SHA），保证
          # 管理器与内核内建模块配对；标准版缺失视为错误，伪装版缺失降级
          # 两个变体目录先建齐：旧构建 run 只下了 manager artifact 时 dl/spoof 不存在，
          # find 对不存在路径返回非零，pipefail + set -e 下会直接炸掉步骤
          mkdir -p "$RUNNER_TEMP/dl/mgr" "$RUNNER_TEMP/dl/spoof"
          N_PLAIN=$(find "$RUNNER_TEMP/dl/mgr" "$RUNNER_TEMP/dl/spoof" -type f -name '*.apk' ! -name '*spoofed*' 2>/dev/null | wc -l)
          N_SPOOF=$(find "$RUNNER_TEMP/dl/mgr" "$RUNNER_TEMP/dl/spoof" -type f -name '*.apk' -name '*spoofed*' 2>/dev/null | wc -l)
          if [ "$N_PLAIN" -eq 0 ] || [ "$N_SPOOF" -eq 0 ]; then
            SU_TAG=$(git show "${HEAD_SHA}:drivers/kernelsu/.sukisu_tag" 2>/dev/null || true)
            if [ -z "$SU_TAG" ]; then
              echo "::warning::no .sukisu_tag anchor at ${HEAD_SHA} - cannot backfill missing manager variants"
            else
              SU_REL=$(gh api "repos/${SUKISU_REPO}/releases/tags/${SU_TAG}") || { echo "::error::anchored release ${SU_TAG} not found on ${SUKISU_REPO}"; exit 1; }
              [ "$(echo "$SU_REL" | jq -r .prerelease)" = "false" ] || { echo "::error::${SU_TAG} is a prerelease"; exit 1; }
              SU_PINNED=$(git show "${HEAD_SHA}:drivers/kernelsu/Kbuild" 2>/dev/null | grep -E '^git_commit_count = [0-9]+$' | awk '{print $3}' || true)
              if [ "$N_PLAIN" -eq 0 ]; then
                SU_PLAIN=$(echo "$SU_REL" | jq -r '.assets[].name' | grep -E '^SukiSU_.*\.apk$' | grep -v spoofed | head -n1 || true)
                [ -n "$SU_PLAIN" ] || { echo "::error::no standard manager APK asset on release ${SU_TAG}"; exit 1; }
                SU_COUNT=$(echo "$SU_PLAIN" | sed -n 's/^SukiSU_v[^_]*_\([0-9]*\).*\.apk$/\1/p')
                if [ -n "$SU_COUNT" ] && [ -n "$SU_PINNED" ] && [ "$SU_COUNT" != "$SU_PINNED" ]; then
                  echo "::error::${SU_PLAIN}: count $SU_COUNT != pinned $SU_PINNED at ${HEAD_SHA} - module/manager pairing mismatch"
                  exit 1
                fi
                curl -fL --retry 3 --connect-timeout 30 "$(echo "$SU_REL" | jq -r --arg n "$SU_PLAIN" '.assets[] | select(.name==$n) | .browser_download_url')" -o "$RUNNER_TEMP/dl/mgr/$SU_PLAIN"
                [ "$(stat -c%s "$RUNNER_TEMP/dl/mgr/$SU_PLAIN")" -gt 1000000 ] || { echo "::error::backfilled standard manager APK looks too small"; exit 1; }
                echo "backfilled standard manager: $SU_PLAIN"
              fi
              if [ "$N_SPOOF" -eq 0 ]; then
                SU_SPOOF=$(echo "$SU_REL" | jq -r '.assets[].name' | grep -E '^SukiSU_.*-spoofed\.apk$' | head -n1 || true)
                if [ -n "$SU_SPOOF" ]; then
                  SU_COUNT=$(echo "$SU_SPOOF" | sed -n 's/^SukiSU_v[^_]*_\([0-9]*\).*\.apk$/\1/p')
                  if [ -n "$SU_COUNT" ] && [ -n "$SU_PINNED" ] && [ "$SU_COUNT" != "$SU_PINNED" ]; then
                    echo "::error::${SU_SPOOF}: count $SU_COUNT != pinned $SU_PINNED at ${HEAD_SHA} - module/manager pairing mismatch"
                    exit 1
                  fi
                  curl -fL --retry 3 --connect-timeout 30 "$(echo "$SU_REL" | jq -r --arg n "$SU_SPOOF" '.assets[] | select(.name==$n) | .browser_download_url')" -o "$RUNNER_TEMP/dl/spoof/$SU_SPOOF"
                  [ "$(stat -c%s "$RUNNER_TEMP/dl/spoof/$SU_SPOOF")" -gt 1000000 ] || { echo "::error::backfilled spoofed manager APK looks too small"; exit 1; }
                  echo "backfilled spoofed manager: $SU_SPOOF"
                else
                  echo "::warning::release ${SU_TAG} has no spoofed manager asset - shipping without it"
                fi
              fi
            fi
          fi
          ls -la "$RUNNER_TEMP/dl/ak3" "$RUNNER_TEMP/dl/mgr" "$RUNNER_TEMP/dl/spoof" 2>/dev/null || true

          # 无 root 内核：noroot 分支构建的 artifact 同名规则（Rodin-<krel>-AnyKernel3），
          # zip 本身即可刷包
          NOROOT_AK3_NAME=""
          if [ -n "${NOROOT_RUN_ID:-}" ]; then
            NOROOT_AK3_ID=""
            while IFS=$'\t' read -r id name; do
              [ -n "$id" ] || continue
              case "$name" in
                *-AnyKernel3) NOROOT_AK3_ID="$id"; NOROOT_AK3_NAME="$name" ;;
              esac
            done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NOROOT_RUN_ID}/artifacts?per_page=100" \
                     --jq '.artifacts[] | select(.expired==false) | "\(.id)\t\(.name)"')
            [ -n "$NOROOT_AK3_ID" ] || { echo "::error::AnyKernel3 artifact not found in noroot run ${NOROOT_RUN_ID}"; exit 1; }
            echo "AK3N  : ${NOROOT_AK3_NAME} (${NOROOT_AK3_ID})"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${NOROOT_AK3_ID}/zip" > "$RUNNER_TEMP/dl/ak3n.zip"
            unzip -oq "$RUNNER_TEMP/dl/ak3n.zip" -d "$RUNNER_TEMP/dl/ak3n"
            test -f "$RUNNER_TEMP/dl/ak3n/Image" || { echo "::error::Image blob missing in noroot AnyKernel3 artifact"; exit 1; }
          fi

          {
            echo "AK3_PATH=${RUNNER_TEMP}/dl/ak3.zip"
            echo "AK3_NAME=${AK3_NAME}"
            echo "AK3N_NAME=${NOROOT_AK3_NAME}"
          } >> "$GITHUB_ENV"

      - name: Extract kernel banner (version / build time / toolchain)
        run: |
          set -euo pipefail
          REL_FROM_ARTIFACT="${AK3_NAME#Rodin-}"
          REL_FROM_ARTIFACT="${REL_FROM_ARTIFACT%-AnyKernel3}"
          KREL="$REL_FROM_ARTIFACT"
          BLDTIME="$(date -u -d "$RUN_CREATED_AT" '+%a %b %e %H:%M:%S UTC %Y')"
          TOOLCHAIN="clang-r596125"
          BANNER_FOUND=""

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lz4 binutils
          RAW="$RUNNER_TEMP/Image.raw"
          if lz4 -d -f "$RUNNER_TEMP/dl/ak3/Image" "$RAW" 2>/dev/null; then
            BANNER=$(strings -n 16 "$RAW" | grep -m1 -E '^Linux version [^ ]+ \(' || true)
          fi
          if [ -n "${BANNER:-}" ]; then
            echo "banner: $BANNER"
            P_REL=$(printf '%s\n' "$BANNER" | sed -E 's/^Linux version ([^ ]+).*/\1/')
            P_TIME=$(printf '%s\n' "$BANNER" | sed -nE 's/.*\) (# [0-9]+ .*)$/\1/p')
            P_TC=$(printf '%s\n' "$BANNER" | sed -nE 's/^Linux version [^ ]+ \([^)]*\) \((.*)\) # [0-9]+ .*$/\1/p')
            [ -n "$P_REL" ] && KREL="$P_REL" && BANNER_FOUND=yes
            [ -n "$P_TIME" ] && BLDTIME="$P_TIME"
            [ -n "$P_TC" ] && TOOLCHAIN="$P_TC"
          fi
          if [ -z "$BANNER_FOUND" ]; then
            echo "::warning::could not parse kernel banner from Image, falling back to artifact name / run time"
          fi

          # 无 root 内核 banner（版本/构建时间/工具链与带 root 版分开提取）
          if [ -n "${NOROOT_RUN_ID:-}" ]; then
            NREL="${AK3N_NAME:-}"
            NREL="${NREL#Rodin-}"
            NREL="${NREL%-AnyKernel3}"
            NBLDTIME="$(date -u -d "${NOROOT_CREATED_AT:-}" '+%a %b %e %H:%M:%S UTC %Y' 2>/dev/null || true)"
            NTOOLCHAIN="clang-r596125"
            if lz4 -d -f "$RUNNER_TEMP/dl/ak3n/Image" "$RUNNER_TEMP/Image_noroot.raw" 2>/dev/null; then
              NBANNER=$(strings -n 16 "$RUNNER_TEMP/Image_noroot.raw" | grep -m1 -E '^Linux version [^ ]+ \(' || true)
              if [ -n "$NBANNER" ]; then
                echo "noroot banner: $NBANNER"
                NREL=$(printf '%s\n' "$NBANNER" | sed -E 's/^Linux version ([^ ]+).*/\1/')
                NP_TIME=$(printf '%s\n' "$NBANNER" | sed -nE 's/.*\) (# [0-9]+ .*)$/\1/p')
                NP_TC=$(printf '%s\n' "$NBANNER" | sed -nE 's/^Linux version [^ ]+ \([^)]*\) \((.*)\) # [0-9]+ .*$/\1/p')
                [ -n "$NP_TIME" ] && NBLDTIME="$NP_TIME"
                [ -n "$NP_TC" ] && NTOOLCHAIN="$NP_TC"
              fi
            else
              echo "::warning::could not decompress noroot Image for banner, falling back to artifact name / run time"
            fi
            {
              echo "NKREL=${NREL}"
              echo "NSHORT=$(printf '%s' "$NREL" | cut -d- -f1)"
              echo "NBLDTIME=${NBLDTIME}"
              echo "NTOOLCHAIN=${NTOOLCHAIN}"
            } >> "$GITHUB_ENV"
          fi

          SHORT="$(printf '%s' "$KREL" | cut -d- -f1)"
          {
            echo "KREL=${KREL}"
            echo "SHORT=${SHORT}"
            echo "BLDTIME=${BLDTIME}"
            echo "TOOLCHAIN=${TOOLCHAIN}"
          } >> "$GITHUB_ENV"
          echo "内核版本：$KREL"
          echo "构建时间：$BLDTIME"
          echo "构建工具链：$TOOLCHAIN"

      - name: Prepare changelog
        run: |
          set -euo pipefail
          CHANGES_FILE="$RUNNER_TEMP/changes.md"
          if [ -n "$CHANGELOG_INPUT" ]; then
            printf '%s\n' "$CHANGELOG_INPUT" > "$CHANGES_FILE"
            echo "using manual changelog"
          else
            echo "::warning::changelog input empty - generating from commits"
            PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
            if [ -n "$PREV_TAG" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              RANGE="${PREV_TAG}..${HEAD_SHA}"
            else
              RANGE="HEAD"
            fi
            echo "commit range: ${RANGE} (prev tag: ${PREV_TAG:-<none>})"
            git log -n 40 --no-merges --pretty='- %s' "$RANGE" > "$CHANGES_FILE" || true
            [ -s "$CHANGES_FILE" ] || printf '%s\n' '- 常规内核同步与维护' > "$CHANGES_FILE"
          fi
          echo "----- changes.md -----"
          cat "$CHANGES_FILE"
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}

      - name: Create release
        env:
          # 本仓库是 fork，org/repo 的 workflow 默认权限为只读，GITHUB_TOKEN 创建 release
          # 会被拒（HTTP 403: Resource not accessible by integration），因此改用 PAT
          PAT: ${{ secrets.GH_PAT }}
          IN_TAG: ${{ inputs.tag }}
          IN_TITLE: ${{ inputs.title }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ -n "${PAT}" ]; then
            export GH_TOKEN="${PAT}"
          else
            echo "::warning::secret GH_PAT not set, falling back to GITHUB_TOKEN"
            export GH_TOKEN="${GITHUB_TOKEN}"
          fi
          if gh release view "$IN_TAG" >/dev/null 2>&1; then
            echo "::error::release ${IN_TAG} already exists"; exit 1
          fi

          mkdir -p out
          cp "$RUNNER_TEMP/dl/ak3.zip" "out/AnyKernel3_${SHORT}.zip"
          ASSETS=("out/AnyKernel3_${SHORT}.zip")
          if [ -n "${NSHORT:-}" ]; then
            cp "$RUNNER_TEMP/dl/ak3n.zip" "out/AnyKernel3_${NSHORT}_noroot.zip"
            ASSETS+=("out/AnyKernel3_${NSHORT}_noroot.zip")
          fi
          while IFS= read -r apk; do
            [ -n "$apk" ] || continue
            cp "$apk" "out/$(basename "$apk")"
            ASSETS+=("out/$(basename "$apk")")
          done < <(find "$RUNNER_TEMP/dl/mgr" "$RUNNER_TEMP/dl/spoof" -type f -name '*.apk' 2>/dev/null | sort)
          ls -la out

          # 说明模板按实际收集到的资产生成：两种内核各一条 + 实际附带的管理器
          NOTES="$RUNNER_TEMP/notes.md"
          {
            printf '内核版本（带 root）：%s\n' "$KREL"
            printf '构建时间（带 root）：%s\n' "$BLDTIME"
            printf '构建工具链（带 root）：%s\n' "$TOOLCHAIN"
            if [ -n "${NSHORT:-}" ]; then
              printf '\n内核版本（无 root）：%s\n' "$NKREL"
              printf '构建时间（无 root）：%s\n' "${NBLDTIME:-}"
              printf '构建工具链（无 root）：%s\n' "${NTOOLCHAIN:-}"
              if [ "$NSHORT" != "$SHORT" ]; then
                printf '⚠ 无 root 内核与带 root 内核版本不一致，刷入前请确认。\n'
              fi
            fi
            printf '\n'
            if [ -n "${NSHORT:-}" ]; then
              printf '## 下载说明（两种内核二选一刷入）\n\n'
            else
              printf '## 下载说明\n\n'
            fi
            printf -- '- `AnyKernel3_%s.zip`：带 root 内核（内置 SukiSU-Ultra，配合管理器获取 root）\n' "$SHORT"
            if [ -n "${NSHORT:-}" ]; then
              if [ "$NSHORT" != "$SHORT" ]; then
                printf -- '- `AnyKernel3_%s_noroot.zip`：无 root 纯净内核（不含 KernelSU；注意其内核版本为 %s，与带 root 版 %s 不一致）\n' "$NSHORT" "$NKREL" "$KREL"
              else
                printf -- '- `AnyKernel3_%s_noroot.zip`：无 root 纯净内核（不含 KernelSU，不需要 root 的场景使用）\n' "$NSHORT"
              fi
            fi
            printf '\n管理器 apk 与带 root 内核配套（刷无 root 内核不需要管理器）：\n\n'
            N_APK=0
            for apk in out/*.apk; do
              [ -e "$apk" ] || continue
              N_APK=$((N_APK + 1))
              case "$(basename "$apk")" in
                *spoofed*) printf -- '- `%s`：伪装版管理器（包名伪装，便于隐藏 root）\n' "$(basename "$apk")" ;;
                *)         printf -- '- `%s`：标准版管理器\n' "$(basename "$apk")" ;;
              esac
            done
            [ "$N_APK" -gt 0 ] || printf -- '- （本次发布未附带管理器）\n'
            printf '\n变更：\n'
            cat "$RUNNER_TEMP/changes.md"
          } > "$NOTES"
          echo "----- release notes -----"
          cat "$NOTES"

          EXTRA=()
          if [ "${IN_PRERELEASE}" != "false" ]; then
            EXTRA+=(--prerelease)
          else
            EXTRA+=(--latest)
          fi

          gh release create "$IN_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${HEAD_SHA:-$KERNEL_BRANCH}" \
            --title "${IN_TITLE:-$IN_TAG}" \
            --notes-file "$NOTES" \
            "${EXTRA[@]}" \
            "${ASSETS[@]}"

          gh release view "$IN_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url --jq '"released \(.tagName) prerelease=\(.isPrerelease) \(.url)"' \
            >> "$GITHUB_STEP_SUMMARY"
